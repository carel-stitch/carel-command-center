<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Carel Command Center — Meeting Notes</title>
  <style>
    @font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Regular.otf') format('opentype');font-weight:400 500;font-style:normal;font-display:swap}@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Semibold.otf') format('opentype');font-weight:600 700;font-style:normal;font-display:swap}
    :root{--bg:#0f0c15;--panel:#1b1723;--line:rgba(245,244,244,.08);--line2:rgba(245,244,244,.16);--ink:#f5f4f4;--ink2:rgba(245,244,244,.70);--muted:rgba(245,244,244,.44);--brand:#6e2cff;--mist:#e3deff;--amber:#ff8a3d;--green:#42d58a;--red:#ff6b5f;--blue:#7cb7ff;--shadow:0 24px 80px rgba(0,0,0,.32)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px circle at 88% -20%,rgba(110,44,255,.25),transparent 58%),linear-gradient(180deg,#15111d 0%,#0f0c15 42%);color:var(--ink);font-family:'Suisse Intl',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.45}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--mist);text-underline-offset:3px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(15,12,21,.78);backdrop-filter:blur(18px);position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:12px}.mark{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}.brand h1{font-size:18px;line-height:1;margin:3px 0 0;font-weight:600;letter-spacing:-.035em}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--line);background:rgba(245,244,244,.035);color:var(--ink2);border-radius:999px;padding:8px 11px;font-size:12px;text-decoration:none}.nav a.active,.btn.primary{background:var(--ink);color:var(--bg)}.btn:hover{border-color:var(--line2);color:var(--ink)}.wrap{max-width:1280px;margin:0 auto;padding:20px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}.hero h2{font-size:30px;margin:0 0 4px;letter-spacing:-.045em}.hero p{margin:0;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:14px}.search,select{width:100%;border:1px solid var(--line);background:rgba(245,244,244,.045);border-radius:14px;color:var(--ink);padding:11px 12px;outline:0}.search::placeholder{color:var(--muted)}select option{background:#17121f}.grid{display:grid;gap:12px}.note{background:linear-gradient(180deg,rgba(245,244,244,.055),rgba(245,244,244,.035));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.noteTop{display:flex;justify-content:space-between;gap:14px;margin-bottom:8px}.source{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:3px 7px;color:var(--ink2);background:rgba(245,244,244,.035)}.source.fireflies{border-color:rgba(196,192,255,.32);color:var(--mist)}.source.gemini{border-color:rgba(124,183,255,.32);color:#b8d8ff}.title{font-size:16px;font-weight:650;margin-top:7px}.time{font-size:11px;color:var(--muted);white-space:nowrap}.summary{color:var(--ink2);margin:0 0 12px}.links{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(245,244,244,.035);border-radius:999px;color:var(--ink2);padding:6px 8px;font-size:11px}.tagger{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center}.empty{border:1px dashed var(--line2);border-radius:16px;padding:18px;color:var(--muted);background:rgba(15,12,21,.24)}.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.16s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:760px){.top,.hero{display:block;height:auto}.top{padding:14px 18px}.nav{margin-top:10px}.filters,.tagger{grid-template-columns:1fr}.noteTop{display:block}.time{margin-top:6px}.wrap{padding:14px}}
  </style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">S</div><div><div class="eyebrow">Command Center</div><h1>Meeting notes</h1></div></div><nav class="nav"><a href="/">Deals</a><a class="active" href="/notes.html">Meeting notes</a></nav></header>
<main class="wrap"><section class="hero"><div><h2>Fireflies & Gemini notes</h2><p>Review every captured meeting note, then tag it to the right client/deal.</p></div><div class="pill" id="count">Loading…</div></section><section class="filters"><input id="search" class="search" placeholder="Search notes, clients or deals"/><select id="source"><option value="all">All sources</option><option value="fireflies">Fireflies</option><option value="gemini">Gemini</option></select><select id="linkState"><option value="all">All notes</option><option value="unlinked">Unlinked only</option><option value="linked">Linked only</option></select></section><section id="notes" class="grid"></section></main><div class="toast" id="toast"></div>
<script>
window.SUPABASE_CONFIG={url:'https://gxacfqqqkrurcyyahawb.supabase.co',key:'sb_publishable_WeYwFFlJghylNvUC8GYXnw_GVyzlPAC'};
let data={clients:[],notes:[],totals:{}};const $=q=>document.querySelector(q);const $$=q=>Array.from(document.querySelectorAll(q));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s||'').toLowerCase();const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function allDeals(){return (data.clients||[]).flatMap(c=>(c.deals||[]).map(d=>({...d,client:c.client})))}
function filtered(){const q=norm($('#search').value).trim(),src=$('#source').value,ls=$('#linkState').value;return (data.notes||[]).filter(n=>{const linked=(n.links||[]).length>0;return (src==='all'||n.source===src)&&(ls==='all'||(ls==='linked'&&linked)||(ls==='unlinked'&&!linked))&&(!q||norm(n.title+' '+n.summary+' '+(n.links||[]).map(l=>l.client+' '+l.dealName).join(' ')).includes(q))})}
function render(){const notes=filtered();$('#count').textContent=notes.length+' notes';const clients=data.clients||[];const deals=allDeals();$('#notes').innerHTML=notes.length?notes.map(n=>{const clientOpts=['<option value="">Select client…</option>'].concat(clients.map(c=>'<option value="'+esc(c.client)+'">'+esc(c.client)+'</option>')).join('');const dealOpts=['<option value="">Select deal…</option>'].concat(deals.map(d=>'<option data-client="'+esc(d.client)+'" value="'+esc(d.id)+'">'+esc(d.client+' — '+d.name)+'</option>')).join('');return '<article class="note" data-note="'+esc(n.id)+'"><div class="noteTop"><div><span class="source '+esc(n.source)+'">'+esc(n.sourceLabel||n.source)+'</span><div class="title">'+esc(n.title)+'</div></div><div class="time">'+esc(String(n.time||'').replace('T',' ').replace(/\.\d+.*/,''))+'</div></div><p class="summary">'+esc(n.summary||'No summary captured.')+'</p><div class="links">'+((n.links||[]).length?n.links.map(l=>'<span class="pill">'+esc(l.client)+' · '+esc(l.dealName)+'</span>').join(''):'<span class="pill">Unlinked</span>')+'</div><div class="tagger"><select class="clientSel">'+clientOpts+'</select><select class="dealSel">'+dealOpts+'</select>'+(n.url?'<a class="btn" href="'+esc(n.url)+'" target="_blank" rel="noreferrer">Open</a>':'<span></span>')+'<button class="btn primary tagBtn">Tag note</button></div></article>'}).join(''):'<div class="empty">No meeting notes match this filter.</div>';$$('.note').forEach(card=>{const csel=card.querySelector('.clientSel'),dsel=card.querySelector('.dealSel');csel.onchange=()=>{const client=csel.value;Array.from(dsel.options).forEach(o=>{o.hidden=!!o.dataset.client&&client&&o.dataset.client!==client});dsel.value=''};dsel.onchange=()=>{const opt=dsel.selectedOptions[0];if(opt?.dataset.client)csel.value=opt.dataset.client};card.querySelector('.tagBtn').onclick=async()=>{if(!dsel.value){alert('Choose a deal first.');return}await tag(card.dataset.note,dsel.value);}})}
async function tag(eventId,dealId){const r=await fetch('/api/link-note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({eventId,dealId})});if(!r.ok){alert(await r.text());return}const deal=allDeals().find(d=>d.id===dealId);data.notes=data.notes.map(n=>n.id===eventId?{...n,links:[...(n.links||[]).filter(l=>l.dealId!==dealId),{client:deal.client,dealId,dealName:deal.name,matchReason:'manual'}]}:n);toast('Note tagged');render()}
async function load(){const cfg=window.SUPABASE_CONFIG;const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/cc_snapshots?select=payload,generated_at&published=eq.true&order=generated_at.desc&limit=1',{headers:{apikey:cfg.key,authorization:'Bearer '+cfg.key}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();data=rows?.[0]?.payload||data;render()}
['search','source','linkState'].forEach(id=>$('#'+id).addEventListener('input',render));load().catch(e=>{$('#notes').innerHTML='<div class="empty">Could not load Supabase snapshot: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
