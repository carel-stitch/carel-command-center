<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="robots" content="noindex,nofollow"/><title>Carel Command Center</title><style>
@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Regular.otf') format('opentype');font-weight:400 500;font-style:normal;font-display:swap}@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Semibold.otf') format('opentype');font-weight:600 700;font-style:normal;font-display:swap}@font-face{font-family:'Suisse Intl';src:url('/assets/fonts/SuisseIntl-Black.otf') format('opentype');font-weight:900;font-style:normal;font-display:swap}
:root{--bg:#0f0c15;--bg2:#15121c;--panel:#1b1723;--panel2:#211d2a;--line:rgba(245,244,244,.08);--line2:rgba(245,244,244,.14);--ink:#f5f4f4;--ink2:rgba(245,244,244,.68);--muted:rgba(245,244,244,.42);--brand:#6e2cff;--lavender:#c4c0ff;--mist:#e3deff;--amber:#ff8a3d;--red:#ff6b5f;--green:#42d58a;--blue:#7cb7ff;--shadow:0 24px 80px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:radial-gradient(900px circle at 88% -20%,rgba(110,44,255,.25),transparent 58%),linear-gradient(180deg,#15111d 0%,#0f0c15 42%);color:var(--ink);font-family:'Suisse Intl',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.008em}button,input{font:inherit}button{cursor:pointer}a{color:var(--mist);text-underline-offset:3px}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:grid;grid-template-columns:360px minmax(0,1fr);gap:0;border-bottom:1px solid var(--line);background:rgba(15,12,21,.78);backdrop-filter:blur(18px)}.brand{height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;border-right:1px solid var(--line)}.mark{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;letter-spacing:-.08em}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}.brand h1{font-size:18px;line-height:1;margin:3px 0 0;font-weight:600;letter-spacing:-.035em}.topRight{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;min-width:0}.snapshot{display:flex;gap:8px;align-items:center;min-width:0}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(245,244,244,.035);border-radius:999px;color:var(--ink2);padding:7px 10px;font-size:12px;font-weight:500;white-space:nowrap}.pill.hot{border-color:rgba(110,44,255,.38);background:rgba(110,44,255,.14);color:var(--mist)}.pill.warn{border-color:rgba(255,138,61,.35);background:rgba(255,138,61,.11);color:#ffc3a0}.pill.red{border-color:rgba(255,107,95,.38);background:rgba(255,107,95,.11);color:#ffb6b0}.statusFilters{display:flex;gap:6px;align-items:center;overflow:auto}.statusBtn{border:1px solid var(--line);background:rgba(245,244,244,.025);color:var(--ink2);border-radius:999px;padding:8px 10px;font-size:12px;white-space:nowrap}.statusBtn:hover{border-color:var(--line2);color:var(--ink)}.statusBtn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}.main{min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}.rail{min-height:0;border-right:1px solid var(--line);background:rgba(15,12,21,.50);display:grid;grid-template-rows:auto 1fr}.railHead{padding:16px}.railTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.railTitle strong{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}.railTitle span{font-size:12px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);background:rgba(245,244,244,.045);border-radius:14px;color:var(--ink);padding:11px 12px;outline:0}.search::placeholder{color:var(--muted)}.search:focus{border-color:rgba(196,192,255,.6);box-shadow:0 0 0 3px rgba(110,44,255,.18)}.list{overflow:auto;padding:0 10px 20px}.client{margin:0 0 6px}.clientTop{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);text-align:left;border-radius:14px;padding:10px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.clientTop:hover{background:rgba(245,244,244,.035)}.clientTop.open{background:rgba(245,244,244,.045);border-color:var(--line)}.chev{color:var(--muted);font-size:12px;transition:transform .16s ease}.clientTop.open .chev{transform:rotate(90deg)}.clientName{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clientMeta{font-size:11px;color:var(--muted);margin-top:2px}.clientActs{font-size:11px;color:var(--muted)}.deals{padding:2px 0 8px 23px;display:grid;gap:3px}.deal{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);text-align:left;border-radius:12px;padding:9px 9px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.deal:hover{background:rgba(245,244,244,.045)}.deal.active{background:linear-gradient(135deg,rgba(110,44,255,.24),rgba(245,244,244,.045));border-color:rgba(196,192,255,.28)}.dealName{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dealMeta{font-size:11px;color:var(--muted);margin-top:2px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(66,213,138,.08)}.dot.red{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,95,.09)}.dot.warn{background:var(--amber);box-shadow:0 0 0 4px rgba(255,138,61,.09)}.dot.done{background:var(--muted);box-shadow:none}.content{min-width:0;min-height:0;overflow:auto;padding:18px 22px 34px}.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}.ghost{border:1px solid var(--line);background:rgba(245,244,244,.035);color:var(--ink2);border-radius:999px;padding:8px 10px;font-size:12px}.ghost:hover{color:var(--ink);border-color:var(--line2)}.hero{margin-bottom:14px}.panel{background:linear-gradient(180deg,rgba(245,244,244,.055),rgba(245,244,244,.035));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.dealHero{padding:18px 20px}.clientLabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}.dealHero h2{font-size:28px;line-height:1.02;letter-spacing:-.045em;font-weight:700;margin:0 0 10px;max-width:920px}.metaRow{display:flex;gap:8px;flex-wrap:wrap}.sidePanel{padding:14px}.sectionKicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}.kpis{display:grid;grid-template-columns:1fr;gap:8px}.kpi{background:rgba(15,12,21,.30);border:1px solid var(--line);border-radius:13px;padding:9px 10px}.kpi .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.kpi .v{margin-top:2px;font-size:12px;color:var(--ink2);word-break:break-word}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.summaryGrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-bottom:16px}.summaryBox{padding:16px 18px}.summaryBox h3{font-size:16px;margin:0 0 10px}.nextText{color:var(--ink);font-size:15px;line-height:1.5;white-space:pre-wrap}.compactHeader{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.driMini{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}.driMini .pill{font-size:10px;padding:5px 7px;color:var(--muted)}.workbench.stack{display:grid;gap:14px}.section{padding:16px 18px}.section h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:-.02em}.text{color:var(--ink2);white-space:pre-wrap}.activity{display:grid;gap:10px}.act{background:rgba(15,12,21,.36);border:1px solid var(--line);border-radius:16px;padding:14px}.actHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.source{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:3px 7px;color:var(--ink2);background:rgba(245,244,244,.035)}.source.Fireflies,.source.Gemini{border-color:rgba(196,192,255,.32);color:var(--mist)}.source.Email,.source.Gmail,.source.Fireflies\ email,.source.Gemini\ email{border-color:rgba(124,183,255,.32);color:#b8d8ff}.source.SDR,.source.sdr{border-color:rgba(66,213,138,.32);color:#a8efc9}.source.Slack{border-color:rgba(255,138,61,.32);color:#ffc3a0}.actTitle{font-size:14px;font-weight:600;color:var(--ink);margin-top:6px}.time{font-size:11px;color:var(--muted);white-space:nowrap}.act p{margin:0;color:var(--ink2);font-size:13px;line-height:1.5}.empty{border:1px dashed var(--line2);border-radius:16px;padding:18px;color:var(--muted);background:rgba(15,12,21,.24)}.coverage{display:flex;gap:7px;flex-wrap:wrap}.coverage .pill{font-size:11px;padding:6px 8px}.noDeals{color:var(--muted);font-size:12px;padding:8px 9px 12px 23px}@media(max-width:1120px){body{overflow:auto}.app{height:auto}.top,.main{grid-template-columns:1fr}.brand{border-right:0}.topRight{height:auto;display:block;padding:12px 16px}.statusFilters{margin-top:10px}.main{display:block}.rail{max-height:55vh;border-right:0;border-bottom:1px solid var(--line)}.summaryGrid,.workbench{grid-template-columns:1fr}.content{overflow:visible}.snapshot{flex-wrap:wrap}.driMini{justify-content:flex-start}}@media(max-width:640px){.dealHero h2{font-size:32px}.content{padding:14px}.snapshot{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">S</div><div><div class="eyebrow">Command Center</div><h1>Carel’s SC deals</h1></div></div><div class="topRight"><div class="snapshot"><span class="pill hot" id="statDeals"></span><span class="pill" id="statClients"></span><span class="pill warn" id="statActivity"></span></div><div class="statusFilters" aria-label="Deal status filters"><button class="statusBtn active" data-status="all">All</button><button class="statusBtn" data-status="On Track">On Track</button><button class="statusBtn" data-status="Off Track">Off Track</button><button class="statusBtn" data-status="At Risk">At Risk</button><button class="statusBtn" data-status="Not Started">Not Started</button><button class="statusBtn" data-status="Complete">Complete</button></div></div></header><main class="main"><aside class="rail"><div class="railHead"><div class="railTitle"><strong>Clients</strong><span id="railCount"></span></div><input id="search" class="search" placeholder="Search client or deal"/></div><div class="list" id="clientList"></div></aside><section class="content"><div class="toolbar"><button class="ghost" id="copyBrief">Copy brief</button><button class="ghost" onclick="window.print()">Print</button></div><div class="hero"><article class="panel dealHero" id="dealHero"></article></div><div class="summaryGrid"><section class="panel summaryBox"><div class="sectionKicker">Action summary</div><h3>Next steps</h3><div class="nextText" id="nextSteps"></div></section><section class="panel summaryBox"><div class="sectionKicker">Outstanding</div><div class="text" id="outstanding"></div></section></div><div class="workbench"><main class="panel section"><div class="sectionKicker">Today</div><h3>Activity</h3><div class="activity" id="activity"></div></main><aside class="stack"><section class="panel section"><div class="sectionKicker">Compass</div><h3>Status</h3><div class="text" id="statusNote"></div></section><section class="panel section"><div class="sectionKicker">Deal facts</div><div class="kpis" id="facts"></div></section><section class="panel section"><div class="sectionKicker">Coverage</div><div class="coverage" id="coverage"></div></section></aside></div></section></main></div><script>
window.COMMAND_DATA={"generatedAt":"1970-01-01T00:00:00.000Z","filter":"Supabase runtime data","totals":{"deals":0,"clients":0,"activity":0},"sourceCoverage":{"Supabase":"Waiting for published snapshot"},"clients":[]};
window.SUPABASE_CONFIG={"url":"https://gxacfqqqkrurcyyahawb.supabase.co","key":"sb_publishable_WeYwFFlJghylNvUC8GYXnw_GVyzlPAC"};
let data=window.COMMAND_DATA;
let selected={c:0,d:0};
let expanded=new Set([data.clients && data.clients[0] ? data.clients[0].client : '']);
let statusFilter='all';
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const statusDot=s=>s==='Off Track'||s==='At Risk'?'red':s==='Not Started'?'warn':s==='Complete'?'done':'';
const pillClass=s=>s==='Off Track'||s==='At Risk'?'red':s==='Not Started'?'warn':s==='Complete'?'':'hot';
function filteredDeals(c){
  const q=$('#search') ? $('#search').value.toLowerCase().trim() : '';
  return (c.deals||[]).filter(d=>{
    const statusOk=statusFilter==='all'||d.status===statusFilter;
    const queryOk=!q||(c.client+' '+d.name+' '+d.status+' '+d.salesStage).toLowerCase().includes(q);
    return statusOk&&queryOk;
  });
}
function clientRows(){
  const q=$('#search') ? $('#search').value.toLowerCase().trim() : '';
  return (data.clients||[]).map(c=>({...c,visibleDeals:filteredDeals(c)})).filter(c=>c.visibleDeals.length||(!q&&statusFilter==='all')||c.client.toLowerCase().includes(q));
}
function renderStats(){
  $('#statDeals').textContent=(data.totals?.deals||0)+' SC deals';
  $('#statClients').textContent=(data.totals?.clients||0)+' clients';
  $('#statActivity').textContent=(data.totals?.activity||0)+' activity records';
  $('#railCount').textContent=clientRows().length+' shown';
  $('#coverage').innerHTML=Object.entries(data.sourceCoverage||{}).map(([k,v])=>'<span class="pill">'+esc(k)+': '+esc(v)+'</span>').join('');
}
function renderList(){
  const arr=clientRows();
  $('#railCount').textContent=arr.length+' shown';
  $('#clientList').innerHTML=arr.map(c=>{
    const isOpen=expanded.has(c.client);
    const count=c.visibleDeals.length;
    const activeClient=data.clients[selected.c]&&data.clients[selected.c].client===c.client;
    return '<div class="client"><button class="clientTop '+(isOpen?'open':'')+' '+(activeClient?'active':'')+'" data-client="'+esc(c.client)+'"><span class="chev">›</span><div><div class="clientName">'+esc(c.client)+'</div><div class="clientMeta">'+count+' matching / '+(c.deals||[]).length+' total deals</div></div><span class="clientActs">'+(c.activities||[]).length+' acts</span></button>'+(isOpen?'<div class="deals">'+(count?c.visibleDeals.map(d=>'<button class="deal '+((data.clients[selected.c]?.client===c.client&&data.clients[selected.c]?.deals[selected.d]?.id===d.id)?'active':'')+'" data-client="'+esc(c.client)+'" data-deal="'+esc(d.id)+'"><div><div class="dealName">'+esc(d.name)+'</div><div class="dealMeta">'+esc(d.salesStage)+' · '+esc(d.status)+'</div></div><span class="dot '+statusDot(d.status)+'"></span></button>').join(''):'<div class="noDeals">No deals match this filter.</div>')+'</div>':'')+'</div>';
  }).join('');
  document.querySelectorAll('.clientTop').forEach(b=>b.onclick=()=>{const name=b.dataset.client;if(expanded.has(name))expanded.delete(name);else expanded.add(name);renderList();});
  document.querySelectorAll('.deal').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=data.clients.findIndex(x=>x.client===b.dataset.client);const d=data.clients[c].deals.findIndex(x=>x.id===b.dataset.deal);selected={c,d};expanded.add(data.clients[c].client);renderList();renderDetail();});
}
function current(){return {client:data.clients[selected.c],deal:data.clients[selected.c].deals[selected.d]};}
function renderDetail(){
  if(!data.clients?.length){$('#dealHero').innerHTML='<h2>No data yet</h2>';return;}
  const cur=current();const client=cur.client,deal=cur.deal;
  $('#dealHero').innerHTML='<div class="compactHeader"><div><div class="clientLabel">'+esc(client.client)+'</div><h2>'+esc(deal.name)+'</h2><div class="metaRow"><span class="pill '+pillClass(deal.status)+'">'+esc(deal.status)+'</span><span class="pill">'+esc(deal.salesStage)+'</span><span class="pill">'+(client.activities||[]).length+' activities</span></div></div><div class="driMini"><span class="pill">SC '+esc(deal.scDri||'—')+'</span><span class="pill">SA '+esc(deal.saDri||'—')+'</span><span class="pill">Sales '+esc(deal.salesDri||'—')+'</span><span class="pill">CS '+esc(deal.csDri||'—')+'</span></div></div>';
  $('#facts').innerHTML=[['Stage',deal.salesStage||'—'],['Status',deal.status||'—'],['Updated',(deal.updatedAt||'').replace('T',' ').replace(/\.\d+.*/,'')],['Client',client.client||'—']].map(([k,v])=>'<div class="kpi"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>').join('');
  $('#statusNote').textContent=deal.parsedStatus||'No Compass status note captured.';
  $('#nextSteps').textContent=deal.nextSteps||'No Compass next steps captured.';$('#outstanding').textContent=(deal.status==='Complete'?'No outstanding action flagged in Compass.':(deal.nextSteps||deal.parsedStatus||'No explicit outstanding item captured yet.'));
  const acts=client.activities||[];
  $('#activity').innerHTML=acts.length?acts.map(a=>'<div class="act"><div class="actHead"><div><span class="source '+esc(a.source)+'">'+esc(a.source)+'</span><div class="actTitle">'+esc(a.title)+'</div></div><div class="time">'+esc(String(a.time||'').replace('T',' ').replace(/\.\d+.*/,''))+'</div></div><p>'+esc(a.summary||'No summary captured.')+'</p>'+(a.url?'<p style="margin-top:8px"><a href="'+esc(a.url)+'" target="_blank" rel="noreferrer">Open source</a></p>':'')+'</div>').join(''):'<div class="empty">No matched activity today. This will improve as the 30-min sync runs.</div>';
}
function brief(){const cur=current();const client=cur.client,deal=cur.deal;return ['*'+client.client+' — '+deal.name+'*','Status: '+deal.salesStage+' / '+deal.status,'SC: '+(deal.scDri||'—'),'','Status note:',(deal.parsedStatus||'—'),'','Next steps:',(deal.nextSteps||'—'),'','Today activity: '+(client.activities||[]).length+' matched records.'].join('\n');}
async function loadLatestSnapshot(){
  try{
    const cfg=window.SUPABASE_CONFIG;
    const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/cc_snapshots?select=payload,generated_at&published=eq.true&order=generated_at.desc&limit=1',{headers:{apikey:cfg.key,authorization:'Bearer '+cfg.key}});
    if(!r.ok)throw new Error(await r.text());
    const rows=await r.json();
    if(rows&&rows[0]&&rows[0].payload){data=rows[0].payload;selected={c:0,d:0};expanded=new Set([data.clients?.[0]?.client||'']);return true;}
  }catch(e){console.warn('Supabase snapshot unavailable; using embedded fallback',e);}
  return false;
}
document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.statusBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');statusFilter=b.dataset.status;renderStats();renderList();});
$('#search').addEventListener('input',()=>{renderStats();renderList();});
$('#copyBrief').onclick=async()=>{try{await navigator.clipboard.writeText(brief());$('#copyBrief').textContent='Copied';setTimeout(()=>$('#copyBrief').textContent='Copy brief',1300);}catch{alert('Copy failed');}};
renderStats();renderList();renderDetail();
loadLatestSnapshot().then(ok=>{if(ok){renderStats();renderList();renderDetail();}});
</script></body></html>
